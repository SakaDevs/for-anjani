<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Untuk Kesayanganku</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Poppins:wght@300;400;600&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: #050505; 
            color: #e0e0e0;
            font-family: 'Poppins', sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* --- Tampilan Peringatan Khusus HP --- */
        #mobile-warning {
            display: none; /* Disembunyikan secara default (di laptop) */
            text-align: center;
            padding: 2rem;
            z-index: 9999;
        }

        #mobile-warning h1 {
            font-size: 2rem;
            color: #ff3366;
            margin-bottom: 1rem;
        }

        #mobile-warning p {
            font-size: 1.1rem;
            color: #b0b0b0;
            line-height: 1.6;
        }

        /* --- Konten Utama (Disembunyikan di HP nanti) --- */
        #desktop-content {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
        }

        .container {
            padding: 2rem;
            z-index: 10;
            text-align: center;
            transition: opacity 1s ease-in-out;
            position: relative;
        }

        h1.title {
            font-family: 'Playfair Display', serif;
            font-size: 2.5rem;
            color: #ff3366;
            margin-bottom: 1rem;
        }

        p.msg {
            font-size: 1.5rem; 
            margin-bottom: 2rem;
            color: #b0b0b0;
            max-width: 400px;
            line-height: 1.6;
            margin-left: auto;
            margin-right: auto;
            transition: all 0.3s ease; 
        }

        .btn-group {
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        button {
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
            font-size: 1rem;
            padding: 12px 30px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        #btn-yes {
            background: linear-gradient(45deg, #800020, #ff3366);
            color: white;
            box-shadow: 0 4px 15px rgba(255, 51, 102, 0.3);
        }

        #btn-no {
            background: #1a1a1a;
            color: #888;
            border: 1px solid #333;
            position: relative;
        }

        /* Iframe untuk memanggil flower.html */
        #flower-frame {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            opacity: 0;
            transition: opacity 2s ease-in-out;
            pointer-events: auto;
            z-index: 1;
        }

        /* Styling Pantun Romantis */
        #poem-screen {
            position: absolute;
            top: 15%; 
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 600px;
            text-align: center;
            z-index: 10;
            opacity: 0;
            transition: opacity 2.5s ease-in-out;
            pointer-events: none;
        }

        .pantun {
            font-family: 'Playfair Display', serif;
            font-size: 1.5rem;
            line-height: 1.8;
            color: #ffcccc;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8), 0 0 20px rgba(255, 51, 102, 0.6);
            font-style: italic;
        }

        /* --- Efek Raining Photos --- */
        #photo-rain-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; 
            overflow: hidden;
            z-index: 5; 
            opacity: 0;
            transition: opacity 2s ease-in-out;
        }

        .raindrop-photo {
            position: absolute;
            top: -200px;
            width: 90px; 
            height: 120px; 
            object-fit: cover;
            border-radius: 8px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.6);
            animation: rain linear infinite;
            opacity: 0.7;
        }

        @keyframes rain {
            0% { transform: translateY(-100px) rotate(-15deg); }
            100% { transform: translateY(110vh) rotate(20deg); }
        }

        /* =======================================================
           MEDIA QUERY: MENDETEKSI LAYAR HP (Lebar maksimal 768px)
           ======================================================= */
        @media screen and (max-width: 768px) {
            #desktop-content {
                display: none !important; /* Matikan semua konten utama */
            }
            #mobile-warning {
                display: block !important; /* Munculkan pesan peringatan */
            }
        }
    </style>
</head>
<body>

    <div id="mobile-warning">
        <h1>Akses Ditolak 🛑</h1>
        <p>Sayang, buka link ini pakai <b>Laptop atau PC</b> ya biar kejutannya lebih maksimal! 💻🤍</p>
    </div>

    <div id="desktop-content">
        <div id="apology-screen" class="container">
            <p class="msg" id="question-text">anjani maafin mas ndak ya? 🥺</p>
            <div class="btn-group">
                <button id="btn-yes">y</button>
                <button id="btn-no">g</button>
            </div>
        </div>

        <iframe id="flower-frame" src=""></iframe>
        <div id="photo-rain-container"></div>
        <div id="poem-screen">
            <p class="pantun">
                Si Ucup namanya Bareta,<br>
                Cintaku padamu tidak bisa dinyatakan lewat kata kata 🤍
            </p>
        </div>
    </div>

    <script>
        const btnNo = document.getElementById('btn-no');
        const btnYes = document.getElementById('btn-yes');
        const apologyScreen = document.getElementById('apology-screen');
        const flowerFrame = document.getElementById('flower-frame');
        const poemScreen = document.getElementById('poem-screen');
        const questionText = document.getElementById('question-text');

        let yesClickCount = 0; 

        // Fungsi tombol lari
        const runAway = () => {
            const maxX = window.innerWidth - btnNo.offsetWidth - 20;
            const maxY = window.innerHeight - btnNo.offsetHeight - 20;
            
            const randomX = Math.floor(Math.random() * maxX);
            const randomY = Math.floor(Math.random() * maxY);
            
            btnNo.style.position = 'fixed';
            btnNo.style.left = `${Math.max(10, randomX)}px`;
            btnNo.style.top = `${Math.max(10, randomY)}px`;
        };

        btnNo.addEventListener('mouseover', runAway);
        btnNo.addEventListener('touchstart', (e) => { e.preventDefault(); runAway(); });
        btnNo.addEventListener('click', (e) => { e.preventDefault(); runAway(); });

        // Fungsi saat klik Iya dengan Validasi
        btnYes.addEventListener('click', () => {
            
            if (yesClickCount === 0) {
                questionText.innerHTML = "Beneran? 🤔";
                yesClickCount++;
            } 
            else if (yesClickCount === 1) {
                questionText.innerHTML = "Asli?? 🥹";
                yesClickCount++;
            } 
            else if (yesClickCount === 2) {
                apologyScreen.style.opacity = '0';
                
                setTimeout(() => {
                    apologyScreen.style.display = 'none';
                    
                    // Panggil animasi bunga
                    flowerFrame.src = "flower.html";
                    flowerFrame.style.opacity = '1';

                    // Siapkan Hujan Foto
                    const rainContainer = document.getElementById('photo-rain-container');
                    
                    const photos = [
                        'images/rani1.jpeg',
                        'images/rani2.jpeg',
                        'images/rani3.jpeg',
                        'images/rani4.jpeg'
                    ]; 

                    for(let i = 0; i < 20; i++) {
                        let img = document.createElement('img');
                        img.src = photos[Math.floor(Math.random() * photos.length)];
                        img.classList.add('raindrop-photo');
                        img.style.left = Math.random() * 100 + 'vw';
                        img.style.animationDuration = (Math.random() * 6 + 6) + 's'; 
                        img.style.animationDelay = (Math.random() * 5) + 's';
                        rainContainer.appendChild(img);
                    }

                    setTimeout(() => {
                        rainContainer.style.opacity = '1';
                    }, 2000);

                    // Munculkan pantun romantis 
                    setTimeout(() => {
                        poemScreen.style.opacity = '1';
                    }, 3500); 

                }, 1000);
            }
        });
    </script>
</body>
</html>
